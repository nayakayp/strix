services:
  dashboard:
    command: uv run --frozen python scripts/viewer_dev.py --manage-scans
    health: /api/capabilities
    portal:
      url: /
      title: Natsuhat local dashboard
      description: Local history, E2B scan management, and LLM settings. Starting scans requires E2B configuration and can incur E2B and LLM charges.
  docker:
    platforms: [linux]
    command: 'sudo dockerd --host=unix:///var/run/docker.sock --group="$(id -gn)"'
