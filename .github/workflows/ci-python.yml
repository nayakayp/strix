name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv lock --check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen mypy natsuhat/

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen bandit -r natsuhat/ -c pyproject.toml

  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --frozen pytest -q

  supabase-contracts:
    name: Hosted PostgreSQL, Auth, and Storage contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Disposable TLS-enabled PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE natsuhat_test LOGIN CREATEROLE PASSWORD 'disposable-ci-only';
          CREATE DATABASE natsuhat_test OWNER natsuhat_test;
          SQL
      - name: No Supabase project or paid workers
        env:
          NATSUHAT_TEST_DATABASE_URL: postgresql://natsuhat_test:disposable-ci-only@127.0.0.1:5432/natsuhat_test?sslmode=require
        run: uv run --frozen pytest -q tests/test_viewer_supabase.py
